name: toneperfect
description: "Client for the TonePerfect pronunciation assessment API, 10 languages: sentence, word and sound scores for a recording of a known text."
version: 0.3.0
homepage: https://api.toneperfect.app
documentation: https://api.toneperfect.app/docs
repository: https://github.com/vm542/toneperfect-sdk/tree/main/dart
issue_tracker: https://github.com/vm542/toneperfect-sdk/issues
topics:
  - pronunciation
  - speech
  - language-learning
  - api
  - sdk

environment:
  sdk: ^3.0.0

dependencies:
  http: ^1.2.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
