name: test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd python && PYTHONPATH=src python -m unittest discover -s tests -v
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd node && npm test
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: cd dart && dart pub get && dart analyze && dart test
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: cd ruby && ruby -Ilib -Itest test/test_client.rb && gem build toneperfect.gemspec
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: cd go && go vet ./... && go test ./...
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: curl }
      - run: composer validate --strict && php php/tests/run.php
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dart-lang/setup-dart@v1
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: curl }
      - run: python3 testing/check_versions.py && python3 testing/run_readme_examples.py && python3 testing/run_readme_examples.py --gateway 1110
